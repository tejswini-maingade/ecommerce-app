apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: backend-hpa
  namespace: ecommerce

spec:

  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-backend

  minReplicas: 2
  maxReplicas: 5

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization
          averageUtilization: 60
