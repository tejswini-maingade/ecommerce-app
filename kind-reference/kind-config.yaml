# 1 control-plane + 2 workers. Ports 80/443 on your laptop go to ingress-nginx.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: audit
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
