name: Health Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 1 12 *"

jobs:
  health-check:
    name: Backend Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull latest backend image
        run: |
          docker pull tejswinim/ecommerce-backend:latest

      - name: Create Docker network
        run: |
          docker network create ecommerce-network

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name ecommerce-db \
            --network ecommerce-network \
            -e POSTGRES_DB=ecommerce_db \
            -e POSTGRES_USER=ecommerce_user \
            -e POSTGRES_PASSWORD='ExamDB@2026' \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to start..."

          for i in {1..30}; do
            if docker exec ecommerce-db pg_isready \
              -U ecommerce_user \
              -d ecommerce_db; then
              echo "✅ PostgreSQL is ready!"
              break
            fi

            echo "Waiting... $i/30"
            sleep 2
          done

      - name: Start Backend
        run: |
          docker run -d \
            --name ecommerce-backend \
            --network ecommerce-network \
            -p 5000:5000 \
            -e PORT=5000 \
            -e DB_URL='postgresql://ecommerce_user:ExamDB%402026@ecommerce-db:5432/ecommerce_db' \
            -e SESSION_SECRET='health-check-secret' \
            -e FRONT_DOMAIN='http://localhost:3000' \
            -e SERVER_URL='http://localhost:5000' \
            -e NODE_ENV='development' \
            -e GITHUB_CLIENT='health-check-client' \
            -e GITHUB_SECRET='health-check-secret' \
            -e STRIPE_PUBLIC='health-check-public' \
            -e STRIPE_SECRET='sk_test_health_check' \
            tejswinim/ecommerce-backend:latest

      - name: Wait for Backend
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl -s http://localhost:5000/ > /tmp/health-response.json; then
              echo "✅ Backend is responding!"
              cat /tmp/health-response.json
              exit 0
            fi

            echo "Backend not ready... $i/30"
            sleep 2
          done

          echo "❌ Backend did not become ready."

          echo ""
          echo "======================================"
          echo "CONTAINER STATUS"
          echo "======================================"
          docker ps -a

          echo ""
          echo "======================================"
          echo "BACKEND LOGS"
          echo "======================================"
          docker logs ecommerce-backend

          exit 1

      - name: Backend Health Check
        run: |
          echo "======================================"
          echo "BACKEND HEALTH CHECK"
          echo "======================================"

          RESPONSE=$(curl --fail http://localhost:5000/)

          echo "Response:"
          echo "$RESPONSE"

          echo ""
          echo "✅ Backend health check passed!"

      - name: Add result to GitHub Summary
        if: always()
        run: |
          echo "## 🏥 Ecommerce Backend Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Docker Image:** \`tejswinim/ecommerce-backend:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Endpoint:** \`http://localhost:5000/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Health check completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker stop ecommerce-backend || true
          docker rm ecommerce-backend || true

          docker stop ecommerce-db || true
          docker rm ecommerce-db || true

          docker network rm ecommerce-network || true
