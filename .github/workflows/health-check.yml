name: Health Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

jobs:
  health-check:
    name: Check Backend Container
    runs-on: ubuntu-latest

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull latest backend image
        run: |
          docker pull tejswinim/ecommerce-backend:latest

      - name: Start backend container
        run: |
          docker run -d \
            --name ecommerce-backend \
            -p 5000:5000 \
            tejswinim/ecommerce-backend:latest

      - name: Wait for application
        run: |
          sleep 10

      - name: Health check
        run: |
          echo "Checking backend application..."
          curl --fail http://localhost:5000/ || exit 1
          echo "✅ Backend health check passed!"

      - name: Add result to GitHub Summary
        if: always()
        run: |
          echo "## 🏥 Ecommerce Backend Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker Image: \`tejswinim/ecommerce-backend:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Health Endpoint: \`http://localhost:5000/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: Health check completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup container
        if: always()
        run: |
          docker stop ecommerce-backend || true
          docker rm ecommerce-backend || true
