name: Health Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

jobs:
  health-check:
    name: Backend Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull backend image
        run: |
          docker pull tejswinim/ecommerce-backend:latest

      - name: Create Docker network
        run: |
          docker network create ecommerce-network

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name ecommerce-db \
            --network ecommerce-network \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=ecommerce \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          sleep 10

      - name: Start backend
        run: |
          docker run -d \
            --name ecommerce-backend \
            --network ecommerce-network \
            -p 5000:5000 \
            -e DB_HOST=ecommerce-db \
            -e DB_PORT=5432 \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e DB_NAME=ecommerce \
            -e DATABASE_URL=postgresql://postgres:postgres@ecommerce-db:5432/ecommerce \
            -e PORT=5000 \
            tejswinim/ecommerce-backend:latest

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          sleep 15

      - name: Check containers
        run: |
          echo "======================================"
          echo "CONTAINER STATUS"
          echo "======================================"
          docker ps -a

          echo ""
          echo "======================================"
          echo "BACKEND LOGS"
          echo "======================================"
          docker logs ecommerce-backend

      - name: Backend health check
        run: |
          echo "======================================"
          echo "BACKEND HEALTH CHECK"
          echo "======================================"

          curl --fail --retry 10 --retry-delay 3 \
            http://localhost:5000/ || exit 1

          echo "✅ Backend health check passed!"

      - name: Add result to GitHub Summary
        if: always()
        run: |
          echo "## 🏥 Ecommerce Backend Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`tejswinim/ecommerce-backend:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Endpoint:** \`http://localhost:5000/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** Health check completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker stop ecommerce-backend || true
          docker rm ecommerce-backend || true

          docker stop ecommerce-db || true
          docker rm ecommerce-db || true

          docker network rm ecommerce-network || true
