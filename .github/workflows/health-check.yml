name: Scheduled Health Check

on:
  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:

jobs:
  health-check:

    runs-on: ubuntu-latest

    steps:

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull backend image
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

      - name: Run backend container
        run: |
          docker run -d \
            --name ecommerce-health \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

      - name: Wait for application
        run: |
          sleep 5

      - name: Health check
        id: health
        run: |
          if curl --fail http://localhost:5000/; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
            echo "✅ Backend health check PASSED"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "❌ Backend health check FAILED"
            exit 1
          fi

      - name: Create summary
        if: always()
        run: |
          echo "## Ecommerce Application Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ steps.health.outputs.status || 'FAILED' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop container
        if: always()
        run: |
          docker stop ecommerce-health || true
          docker rm ecommerce-health || true
