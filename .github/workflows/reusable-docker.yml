name: Reusable Docker Build, Scan and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      context:
        required: true
        type: string

      dockerfile:
        required: true
        type: string

      tag:
        required: true
        type: string

    secrets:
      docker_username:
        required: true

      docker_token:
        required: true

    outputs:
      image_url:
        description: "Docker image URL"
        value: ${{ jobs.docker.outputs.image_url }}

permissions:
  contents: read

jobs:
  docker:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v7

      # --------------------------------------------------
      # 2. Set image name
      # --------------------------------------------------
      - name: Set Docker image
        id: image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          echo "image_url=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Docker Image"
          echo "======================================"
          echo "$IMAGE"

      # --------------------------------------------------
      # 3. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -f "${{ inputs.dockerfile }}" \
            -t "${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}" \
            "${{ inputs.context }}"

      # --------------------------------------------------
      # 4. Verify the image that was just built
      # --------------------------------------------------
      - name: Verify Docker image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"

          echo "======================================"
          echo "Docker Image"
          echo "======================================"
          docker images "$IMAGE"

          echo "======================================"
          echo "Docker Image History"
          echo "======================================"
          docker history "$IMAGE"

          echo "======================================"
          echo "Node Version"
          echo "======================================"
          docker run --rm "$IMAGE" node --version

          echo "======================================"
          echo "Base OS"
          echo "======================================"
          docker run --rm "$IMAGE" cat /etc/os-release

      # --------------------------------------------------
      # 5. Trivy vulnerability scan
      #    HIGH and CRITICAL vulnerabilities fail pipeline
      # --------------------------------------------------
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      # --------------------------------------------------
      # 6. Login to Docker Hub
      #    This runs ONLY if Trivy passes
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # --------------------------------------------------
      # 7. Push image
      # --------------------------------------------------
      - name: Push Docker image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"

          echo "======================================"
          echo "Pushing Docker Image"
          echo "======================================"
          echo "$IMAGE"

          docker push "$IMAGE"

      # --------------------------------------------------
      # 8. Show final result
      # --------------------------------------------------
      - name: Show Docker image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"

          echo "======================================"
          echo "Docker Build + Security Scan + Push"
          echo "======================================"
          echo "Image: $IMAGE"
          echo "Trivy: PASSED"
          echo "Docker Push: PASSED"
