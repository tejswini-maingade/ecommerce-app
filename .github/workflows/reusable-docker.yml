name: Reusable Docker Build, Scan and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      context:
        required: true
        type: string

      dockerfile:
        required: true
        type: string

      tag:
        required: true
        type: string

    secrets:
      docker_username:
        required: true

      docker_token:
        required: true

    outputs:
      image_url:
        description: "Docker image URL"
        value: ${{ jobs.docker.outputs.image_url }}

permissions:
  contents: read

jobs:
  docker:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v7

      # --------------------------------------------------
      # 2. Set image name
      # --------------------------------------------------
      - name: Set Docker image
        id: image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          echo "image_url=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Docker Image"
          echo "======================================"
          echo "$IMAGE"

      # --------------------------------------------------
      # 3. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -f "${{ inputs.dockerfile }}" \
            -t "${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}" \
            "${{ inputs.context }}"

      # --------------------------------------------------
      # 4. Verify Docker image
      # --------------------------------------------------
      - name: Verify Docker image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"

          echo "======================================"
          echo "Docker Image"
          echo "======================================"
          docker images "$IMAGE"

          echo "======================================"
          echo "Docker Image History"
          echo "======================================"
          docker history "$IMAGE"

          echo "======================================"
          echo "Image Inspection"
          echo "======================================"
          docker inspect "$IMAGE" \
            --format='Image: {{.RepoTags}}'

          echo "======================================"
          echo "Base OS"
          echo "======================================"

          if docker run --rm "$IMAGE" cat /etc/os-release; then
            echo "OS information retrieved successfully."
          else
            echo "Could not retrieve OS information."
          fi

      # --------------------------------------------------
      # 5. Trivy vulnerability scan
      # --------------------------------------------------
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      # --------------------------------------------------
      # 6. Login to Docker Hub
      # --------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # --------------------------------------------------
      # 7. Push Docker image
      # --------------------------------------------------
      - name: Push Docker image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"

          echo "======================================"
          echo "Pushing Docker Image"
          echo "======================================"

          docker push "$IMAGE"

      # --------------------------------------------------
      # 8. Final result
      # --------------------------------------------------
      - name: Show final result
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"

          echo "======================================"
          echo "Docker Pipeline Result"
          echo "======================================"
          echo "Image: $IMAGE"
          echo "Trivy: PASSED"
          echo "Docker Push: PASSED"
