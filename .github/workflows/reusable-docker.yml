name: Reusable Docker Build, Scan and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

      context:
        required: true
        type: string

      dockerfile:
        required: true
        type: string

      tag:
        required: true
        type: string

    secrets:
      docker_username:
        required: true

      docker_token:
        required: true

    outputs:
      image_url:
        description: "Docker image URL"
        value: ${{ jobs.docker.outputs.image_url }}

permissions:
  contents: read

jobs:
  docker:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Build Docker image
        run: |
          docker build \
            -f "${{ inputs.dockerfile }}" \
            -t "${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}" \
            "${{ inputs.context }}"

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"

      - name: Set image output
        id: image
        run: |
          IMAGE="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          echo "image_url=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Show Docker image
        run: |
          echo "======================================"
          echo "Docker Image"
          echo "======================================"
          echo "${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
