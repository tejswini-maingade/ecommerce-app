name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: "24"

      run_tests:
        required: false
        type: boolean
        default: true

    outputs:
      test_result:
        description: "Build and test result"
        value: ${{ jobs.build-test.outputs.test_result }}

jobs:
  build-test:

    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.result.outputs.test_result }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install root dependencies
        run: |
          npm install

      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      - name: Build frontend
        id: frontend-build
        run: |
          cd client
          npm run build

      - name: Check backend syntax
        id: backend-check
        run: |
          node --check server/index.js

      - name: Set test result
        id: result
        if: always()
        run: |
          if [ "${{ steps.frontend-build.outcome }}" = "success" ] && \
             [ "${{ steps.backend-check.outcome }}" = "success" ]; then
            echo "test_result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "test_result=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Show result
        run: |
          echo "================================"
          echo "Build and Test Result"
          echo "================================"
          echo "Result: ${{ steps.result.outputs.test_result }}"

      - name: Fail if checks failed
        if: steps.frontend-build.outcome == 'failure' || steps.backend-check.outcome == 'failure'
        run: |
          echo "❌ Build/Test checks failed"
          exit 1
